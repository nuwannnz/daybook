<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daybook — Mobile sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/daybook/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg)}
a{color:var(--accent)}a:hover{color:var(--ink)}
button{font:inherit;cursor:pointer}
input::placeholder{color:var(--ink-done)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 36px 24px 28px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); display: flex; flex-direction: column; gap: 18px">
  <div aria-hidden="true" style="display: flex; gap: 6px">
    <span style="width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--lavender-bg)"></span>
    <span style="width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--mint-bg)"></span>
    <span style="width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--peach-bg)"></span>
  </div>
  <div>
    <h1 class="screen-title" style="margin: 0 0 4px">Welcome back</h1>
    <p style="margin: 0; font-size: 15px; color: var(--ink-muted)">Sign in to Daybook.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 50px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--radius-md); color: var(--ink); font-size: 15px; font-weight: 600">Continue with Apple</button>
    <button style="height: 50px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--radius-md); color: var(--ink); font-size: 15px; font-weight: 600">Continue with Google</button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-muted)">
    <span aria-hidden="true" style="flex: 1; height: 1px; background: var(--border)"></span>
    or with email
    <span aria-hidden="true" style="flex: 1; height: 1px; background: var(--border)"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="ms-email" style="font-size: 14px; font-weight: 600">Email</label>
    <input id="ms-email" type="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}" placeholder="you@example.com" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); font: inherit; font-size: 16px; color: var(--ink)">
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="ms-pass" style="font-size: 14px; font-weight: 600">Password</label>
    <div style="display: flex; align-items: center; height: 50px; box-sizing: border-box; padding: 0 4px 0 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface)">
      <input id="ms-pass" type="{{pwType}}" autocomplete="current-password" value="{{password}}" onChange="{{onPassword}}" style="flex: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: var(--ink)">
      <button onClick="{{toggleShow}}" aria-pressed="{{showPw}}" style="height: 42px; min-width: 56px; padding: 0 10px; border: 0; border-radius: var(--radius-sm); background: var(--sidebar); color: var(--ink-soft); font-size: 13px; font-weight: 600">{{showLabel}}</button>
    </div>
    <a href="Reset.dc.html" style="align-self: flex-end; font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 0">Forgot password?</a>
  </div>

  <a href="Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: var(--radius-lg); background: var(--primary); color: var(--on-primary); font-size: 16px; font-weight: 600; text-decoration: none">Sign in</a>

  <p style="margin: auto 0 0; text-align: center; font-size: 14px; color: var(--ink-muted)">New here? <a href="SignUp.dc.html" style="font-weight: 600; display: inline-block; padding: 12px 4px">Create an account</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const showPw = !!s.showPw;
    return {
      email: s.email || '',
      password: s.password || '',
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPassword: (e) => this.setState({ password: e.target.value }),
      showPw,
      pwType: showPw ? 'text' : 'password',
      showLabel: showPw ? 'Hide' : 'Show',
      toggleShow: () => this.setState({ showPw: !showPw })
    };
  }
}
</script>
</body>
</html>
