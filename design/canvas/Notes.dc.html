<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daybook — Notes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/daybook/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg)}
a{color:var(--accent)}a:hover{color:var(--ink)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div style="font-family: var(--font-sans); color: var(--ink); background: var(--bg); min-height: 100vh; display: flex; flex-wrap: wrap">

<aside aria-label="Sidebar" style="flex: 1 1 248px; box-sizing: border-box; padding: 20px 14px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px">
    <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--lavender-bg); color: var(--lavender-ink); display: grid; place-items: center; font-weight: 700; font-size: 15px">d</span>
    <span style="font-weight: 700; font-size: 16px; letter-spacing: -0.01em">Daybook</span>
  </div>
  <button style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-md); color: var(--ink-muted); font-size: 14px; text-align: left">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span style="flex: 1">Search or jump to…</span>
    <kbd style="font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink-muted); background: var(--sidebar); border-radius: var(--radius-xs); padding: 2px 6px">⌘K</kbd>
  </button>
  <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md); color: var(--ink-soft); font-size: 14px; font-weight: 500; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <span style="flex: 1">Today</span>
    </a>
    <a href="Week.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md); color: var(--ink-soft); font-size: 14px; font-weight: 500; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span style="flex: 1">This week</span>
    </a>
    <a href="Notes.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-raised); color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5M9 13h7M9 17h5"></path></svg>
      <span style="flex: 1">Notes</span>
    </a>
  </nav>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <p style="margin: 0 0 6px; padding: 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted)">Projects</p>
    <a href="Project.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md); color: var(--ink-soft); font-size: 14px; font-weight: 500; text-decoration: none">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 4px; background: var(--lavender-dot)"></span>
      <span style="flex: 1">Website redesign</span>
    </a>
    <a href="Project.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md); color: var(--ink-soft); font-size: 14px; font-weight: 500; text-decoration: none">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 4px; background: var(--mint-dot)"></span>
      <span style="flex: 1">Thesis draft</span>
    </a>
    <a href="Project.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md); color: var(--ink-soft); font-size: 14px; font-weight: 500; text-decoration: none">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 4px; background: var(--peach-dot)"></span>
      <span style="flex: 1">Garden plan</span>
    </a>
    <button style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 0; background: transparent; border-radius: var(--radius-md); color: var(--ink-muted); font-size: 14px; font-weight: 500; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New project
    </button>
  </div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-wrap: wrap; align-items: stretch">

  <section aria-label="Note list" style="flex: 1 1 300px; max-width: 100%; box-sizing: border-box; padding: 28px 16px 32px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 6px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Notes</h1>
      <button aria-label="New note" style="width: 44px; height: 44px; border: 0; border-radius: var(--radius-md); background: var(--primary); color: var(--on-primary); display: grid; place-items: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <div role="group" aria-label="Filter notes" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
      <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="height: 44px; padding: 0 14px; border-radius: var(--radius-pill); border: 0; background: {{f.bg}}; color: {{f.ink}}; font-size: 13px; font-weight: 600">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{list}}" as="n" hint-placeholder-count="6">
      <button onClick="{{n.open}}" aria-current="{{n.current}}" style="display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 12px 14px; border: 1px solid {{n.ring}}; border-radius: var(--radius-md); background: {{n.bg}}; text-align: left; color: var(--ink)">
        <span style="display: flex; align-items: center; gap: 8px; width: 100%">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 3px; flex: none; background: {{n.dot}}"></span>
          <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span>
          <span style="font-size: 12px; color: var(--ink-muted)">{{n.date}}</span>
        </span>
        <span style="font-size: 13px; line-height: 1.45; color: var(--inbox-ink); padding-left: 16px">{{n.excerpt}}</span>
      </button>
      </sc-for>
    </div>
  </section>

  <article style="flex: 999 1 480px; min-width: 0; box-sizing: border-box; padding: 28px clamp(20px, 5vw, 72px) 64px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted)">
        <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); background: {{note.bg}}; color: {{note.ink}}">{{note.group}}</span>
        <span>{{note.meta}}</span>
      </div>
      <div role="toolbar" aria-label="Formatting" style="display: flex; gap: 2px; padding: 3px; background: var(--sidebar); border-radius: var(--radius-md)">
        <button aria-label="Heading" style="width: 44px; height: 40px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-soft); font-size: 14px; font-weight: 700">H</button>
        <button aria-label="Bold" style="width: 44px; height: 40px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-soft); font-size: 14px; font-weight: 800">B</button>
        <button aria-label="Checklist" style="width: 44px; height: 40px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-soft); display: grid; place-items: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="6" height="6" rx="1.5"></rect><path d="M4.5 7l1 1 2-2M13 7h8M3 17h6M13 17h8"></path></svg>
        </button>
        <button aria-label="Link to day or project" style="width: 44px; height: 40px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-soft); display: grid; place-items: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
        </button>
      </div>
    </div>

    <h2 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">{{note.title}}</h2>

    <div style="max-width: 680px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.7; color: var(--ink)">
      <sc-for list="{{note.blocks}}" as="b" hint-placeholder-count="5">
        <sc-if value="{{b.isH}}" hint-placeholder-val="{{false}}"><h3 style="margin: 10px 0 0; font-size: 18px; font-weight: 700; color: var(--ink)">{{b.text}}</h3></sc-if>
        <sc-if value="{{b.isP}}" hint-placeholder-val="{{true}}"><p style="margin: 0">{{b.text}}</p></sc-if>
        <sc-if value="{{b.isLi}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 12px; padding-left: 4px"><span aria-hidden="true" style="width: 6px; height: 6px; margin-top: 11px; flex: none; border-radius: var(--radius-pill); background: var(--lavender-dot)"></span><span>{{b.text}}</span></div>
        </sc-if>
        <sc-if value="{{b.isTodo}}" hint-placeholder-val="{{false}}">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md); background: var(--sidebar)">
            <input type="checkbox" checked="{{b.done}}" onChange="{{b.toggle}}" style="width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--accent)">
            <span style="flex: 1">{{b.text}}</span>
            <span style="font-size: 12px; font-weight: 600; color: var(--accent)">{{b.status}}</span>
          </label>
        </sc-if>
      </sc-for>
    </div>

    <div style="max-width: 680px; margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 700; color: var(--ink-muted)">Linked</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{note.links}}" as="lk" hint-placeholder-count="2">
        <a href="{{lk.href}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--border); color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 3px; background: {{lk.dot}}"></span>{{lk.label}}
        </a>
        </sc-for>
      </div>
    </div>
  </article>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  groups() {
    return {
      Daily: { bg: 'var(--butter-bg)', ink: 'var(--butter-ink)', dot: 'var(--butter-dot)' },
      Website: { bg: 'var(--lavender-bg)', ink: 'var(--lavender-ink)', dot: 'var(--lavender-dot)' },
      Thesis: { bg: 'var(--mint-bg)', ink: 'var(--mint-ink)', dot: 'var(--mint-dot)' },
      Garden: { bg: 'var(--peach-bg)', ink: 'var(--peach-ink)', dot: 'var(--peach-dot)' },
      Ideas: { bg: 'var(--rose-bg)', ink: 'var(--rose-ink)', dot: 'var(--rose-dot)' }
    };
  }
  notes() {
    return [
      { id: 'd20', group: 'Daily', title: 'Tuesday, October 20', date: 'Today', meta: 'Edited 10:41', excerpt: 'Protecting the morning for the wireframe…',
        blocks: [['p', 'Protecting the morning for the wireframe — no meetings before 11.'], ['h', 'Ideas'], ['li', 'Onboarding checklist that hides itself after day 3?'], ['li', 'Ask Maya if launch can move to Nov 12'], ['h', 'Follow-ups'], ['todo', 'Send Sam the wireframe link', 0], ['todo', 'Water the seedlings', 1]],
        links: [['Today', 'Main.dc.html', 'Daily'], ['Website redesign', 'Project.dc.html', 'Website']] },
      { id: 'nav', group: 'Website', title: 'Navigation ideas', date: 'Oct 14', meta: 'Website redesign · Edited Oct 14', excerpt: 'Collapse to four top-level items…',
        blocks: [['p', 'Collapse to four top-level items. Docs moves under Resources.'], ['li', 'Product · Pricing · Resources · Company'], ['li', 'Sign in stays top-right, always visible'], ['todo', 'Check with Sam before wireframe v2', 1]],
        links: [['Website redesign', 'Project.dc.html', 'Website']] },
      { id: 'pri', group: 'Website', title: 'Interview · Priya', date: 'Oct 16', meta: 'Website redesign · Edited Oct 16', excerpt: 'Wanted real examples before signing up…',
        blocks: [['p', 'Wanted to see real examples before signing up, not feature lists.'], ['li', 'Scrolled straight past the hero'], ['li', 'Looked for pricing within the first minute'], ['todo', 'Add an examples strip to wireframe v2', 0]],
        links: [['Website redesign', 'Project.dc.html', 'Website']] },
      { id: 'meth', group: 'Thesis', title: 'Methods outline', date: 'Oct 18', meta: 'Thesis draft · Edited Oct 18', excerpt: 'Intro, data, analysis, limits…',
        blocks: [['h', 'Structure'], ['li', 'Intro: why a mixed-methods design'], ['li', 'Data: sources and sampling'], ['li', 'Analysis: coding approach'], ['todo', 'Write the intro', 0]],
        links: [['Thesis draft', 'Project.dc.html', 'Thesis'], ['This week', 'Week.dc.html', 'Daily']] },
      { id: 'bed', group: 'Garden', title: 'Raised bed sketch', date: 'Oct 17', meta: 'Garden plan · Edited Oct 17', excerpt: 'South fence, tomatoes at the back…',
        blocks: [['p', 'Along the south fence. Tomatoes at the back, herbs at the front edge.'], ['todo', 'Order seed trays', 1], ['todo', 'Buy timber and screws', 0]],
        links: [['Garden plan', 'Project.dc.html', 'Garden']] },
      { id: 'onb', group: 'Ideas', title: 'Self-hiding onboarding', date: 'Oct 20', meta: 'Loose idea · Edited 9:12', excerpt: 'A checklist that disappears after day 3…',
        blocks: [['p', 'A checklist that disappears after day 3, whether or not it is finished.'], ['p', 'Could live in the empty state of Today.']],
        links: [['Today', 'Main.dc.html', 'Daily']] }
    ];
  }
  renderVals() {
    const s = this.state || {};
    const G = this.groups();
    const filter = s.filter || 'All';
    const sel = s.sel || 'd20';
    const checks = s.checks || {};
    const all = this.notes();
    const visible = all.filter((n) => filter === 'All' || n.group === filter);
    const current = all.find((n) => n.id === sel) || all[0];
    const filters = ['All', 'Daily', 'Website', 'Thesis', 'Garden', 'Ideas'].map((f) => ({
      label: f,
      on: f === filter,
      bg: f === filter ? 'var(--primary)' : 'var(--sidebar)',
      ink: f === filter ? 'var(--on-primary)' : 'var(--ink-soft)',
      pick: () => this.setState({ filter: f })
    }));
    const list = visible.map((n) => ({
      title: n.title,
      date: n.date,
      excerpt: n.excerpt,
      dot: G[n.group].dot,
      current: n.id === current.id ? 'true' : 'false',
      bg: n.id === current.id ? 'var(--surface)' : 'transparent',
      ring: n.id === current.id ? 'var(--lavender-dot)' : 'transparent',
      open: () => this.setState({ sel: n.id })
    }));
    const note = {
      title: current.title,
      group: current.group,
      meta: current.meta,
      bg: G[current.group].bg,
      ink: G[current.group].ink,
      blocks: current.blocks.map((b, i) => {
        const key = current.id + ':' + i;
        const done = key in checks ? checks[key] : !!b[2];
        return {
          text: b[1],
          isH: b[0] === 'h',
          isP: b[0] === 'p',
          isLi: b[0] === 'li',
          isTodo: b[0] === 'todo',
          done,
          status: done ? 'Done' : '',
          toggle: () => this.setState({ checks: { ...checks, [key]: !done } })
        };
      }),
      links: current.links.map((l) => ({ label: l[0], href: l[1], dot: G[l[2]].dot }))
    };
    return { filters, list, note };
  }
}
</script>
</body>
</html>
