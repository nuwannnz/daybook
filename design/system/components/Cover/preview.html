<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Daybook — cover</title>
<style>
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); font-family: var(--font-sans); }
  .cv svg { position: absolute; inset: 0; }
  .lav { fill: var(--lavender-bg); } .mint { fill: var(--mint-bg); } .peach { fill: var(--peach-bg); }
  .butter { fill: var(--butter-bg); } .ink { fill: var(--primary); } .cut { fill: var(--bg); }
  .r2xl { rx: var(--radius-2xl); } .rlg { rx: var(--radius-lg); } .rpill { rx: 10px; }
  .cv-text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
  .cv-name { margin: 0; font-size: 100px; line-height: 0.95; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
  .cv-tag { margin: 0; font-size: 14px; color: var(--ink-muted); }
</style>
</head>
<body style="padding: 0">
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: lavender-bg 200x240 (radius-2xl), mint-bg 112x136 and peach-bg 112x168 (radius-lg), butter-bg disc r56, primary 136x112 (radius-lg)
      arrangement: staggered columns like the week board, mint bleeding off the top, peach off the bottom, ink off the right edge
      pattern: pills (soft, friendly, large radii; "colour means project" week strip) - seven pills cut from the ground in the lavender block, today's pill in primary
      steps and radii: space-4 (16) gaps and insets, radius-2xl 22, radius-lg 16, pill = half its 20px width
    -->
    <rect class="lav r2xl" x="496" y="24" width="200" height="240"></rect>
    <rect class="cut rpill" x="512" y="168" width="20" height="80"></rect>
    <rect class="ink rpill" x="538" y="168" width="20" height="80"></rect>
    <rect class="cut rpill" x="564" y="168" width="20" height="80"></rect>
    <rect class="cut rpill" x="590" y="168" width="20" height="80"></rect>
    <rect class="cut rpill" x="616" y="168" width="20" height="80"></rect>
    <rect class="cut rpill" x="642" y="168" width="20" height="80"></rect>
    <rect class="cut rpill" x="668" y="168" width="20" height="80"></rect>
    <rect class="mint rlg" x="712" y="-16" width="112" height="136"></rect>
    <rect class="peach rlg" x="712" y="136" width="112" height="168"></rect>
    <circle class="butter" cx="896" cy="80" r="56"></circle>
    <rect class="ink rlg" x="840" y="152" width="136" height="112"></rect>
  </svg>
  <div class="cv-text">
    <p class="cv-name">Daybook</p>
    <p class="cv-tag">Notes, daily and weekly plans, and projects in one calm place.</p>
  </div>
</div>
</body>
</html>
