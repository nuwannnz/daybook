<!-- @dsCard group="Projects" height=180 subtitle="Done and in progress" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Milestone row — preview</title></head>
<body>
<div class="db-stack" style="max-width: 620px">
  <div class="db-milestone">
    <button class="db-milestone__head" aria-expanded="false">
      <span class="db-milestone__badge db-tone--mint" aria-hidden="true">1</span>
      <span class="db-milestone__name">Discovery<span class="db-milestone__dates">Sep 28 – Oct 9</span></span>
      <span class="db-chip db-tone--mint">Done</span>
      <span style="font-size: 13px; font-weight: 600; color: var(--ink-muted)">4/4</span>
    </button>
  </div>
  <div class="db-milestone db-milestone--active">
    <button class="db-milestone__head" aria-expanded="true">
      <span class="db-milestone__badge" style="background: var(--accent); color: var(--surface)" aria-hidden="true">2</span>
      <span class="db-milestone__name">Wireframes<span class="db-milestone__dates">Oct 12 – 23</span></span>
      <span class="db-chip db-tone--lavender">In progress</span>
      <span style="font-size: 13px; font-weight: 600; color: var(--ink-muted)">2/4</span>
    </button>
  </div>
</div>
</body>
</html>
