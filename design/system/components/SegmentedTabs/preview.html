<!doctype html>
<html>
<head><meta charset="utf-8"><title>Segmented tabs — preview</title></head>
<body>
<div class="db-row">
  <div class="db-seg" role="tablist" aria-label="Project views">
    <button role="tab" aria-selected="true">Overview</button>
    <button role="tab" aria-selected="false">Plan</button>
    <button role="tab" aria-selected="false">Notes</button>
  </div>
  <div class="db-seg" role="tablist" aria-label="Capture type">
    <button role="tab" aria-selected="true">Task</button>
    <button role="tab" aria-selected="false">Note</button>
  </div>
</div>
</body>
</html>
